apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "nodegoat.fullname" . }}
  labels:
    {{- include "nodegoat.labels" . | nindent 4 }}
  {{- if .Values.dbSeed.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  {{- end }}
spec:
  replicas: {{ ternary 0 .Values.replicaCount .Values.labMode.enabled }}
  strategy:
    blueGreen:
      activeService: {{ include "nodegoat.fullname" . }}
      autoPromotionEnabled: {{ .Values.rollout.strategy.blueGreen.autoPromotionEnabled }}
      {{- if .Values.rollout.strategy.blueGreen.previewService.enabled }}
      previewService: {{ include "nodegoat.fullname" . }}-preview
      {{- end }}
  selector:
    matchLabels:
      {{- include "nodegoat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nodegoat.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nodegoat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: MONGODB_URI
              value: {{ .Values.mongodb.uri | quote }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
