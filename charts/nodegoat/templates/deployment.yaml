apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nodegoat.fullname" . }}
  labels:
    {{- include "nodegoat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nodegoat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nodegoat.labels" . | nindent 8 }}
    spec:
      containers:
        - name: nodegoat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: MONGODB_URI
              value: {{ .Values.mongodb.uri | quote }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
