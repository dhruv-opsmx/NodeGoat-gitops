# NodeGoat uses express-session MemoryStore. Running multiple replicas without
# a shared session store causes users to be logged out when requests are served
# by different pods.
replicaCount: 1

image:
  repository: 845322645174.dkr.ecr.us-east-1.amazonaws.com/opsmx/nodegoat
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 4000

ingress:
  enabled: false
  className: alb
  scheme: internet-facing
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

resources:
  requests: 
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 15

mongodb:
  uri: mongodb://mongodb:27017/NodeGoat

# NodeGoat's db:seed script resets the database before loading seed data.
# Treat this Job as an explicit bootstrap/reset mechanism for GitOps-managed environments.
dbSeed:
  enabled: false
  backoffLimit: 2
  # With Argo CD automated self-heal, a TTL-deleted Job can be recreated and run again.
  # Keep dbSeed.enabled true only while the environment should bootstrap or reset data.
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 600
  wait:
    maxAttempts: 60
    intervalSeconds: 5
    connectionTimeoutSeconds: 5

# Lab Mode declaratively pauses runtime workloads to reduce AWS lab costs.
# PVCs are preserved because storage templates are not removed.
labMode:
  enabled: false

rollout:
  strategy:
    blueGreen:
      autoPromotionEnabled: false
      previewService:
        enabled: false
        port: 80
