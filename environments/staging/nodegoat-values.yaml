# NodeGoat uses express-session MemoryStore. Running multiple replicas without
# a shared session store causes users to be logged out when requests are served
# by different pods.
replicaCount: 1

image:
  repository: 845322645174.dkr.ecr.us-east-1.amazonaws.com/opsmx/nodegoat
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 4000

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

readinessProbe:
  httpGet:
    path: /
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 15

mongodb:
  uri: mongodb://mongodb:27017/NodeGoat

dbSeed:
  enabled: false
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 600
  wait:
    maxAttempts: 60
    intervalSeconds: 5
    connectionTimeoutSeconds: 5

# Lab Mode declaratively pauses runtime workloads to reduce AWS lab costs.
# PVCs are preserved because storage templates are not removed.
labMode:
  enabled: false

rollout:
  strategy:
    blueGreen:
      autoPromotionEnabled: false
      previewService:
        enabled: false
        port: 80
